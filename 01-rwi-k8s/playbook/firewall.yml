- name: Replace UFW with Iptables
  hosts: ec2hosts
  remote_user: ubuntu
  gather_facts: false
  vars_files:
    - vars/sec_vars.yml
    - vars/deployment_vars.yml
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for:
        port: 22
        host: '{{ (ansible_ssh_host|default(ansible_host))|default(inventory_hostname) }}'
        search_regex: OpenSSH
        delay: 10
      connection: local

    - name: remove ufw firewall
      become: true
      apt:
        name: ufw
        state: absent
      ignore_errors: true
      register: result
    - debug:
        msg: "{{ result }}"

    - name: install iptables
      become: true
      apt:
        name: iptables
        state: present
      ignore_errors: true
      register: result
    - debug:
        msg: "{{ result }}"

    - name: Iptables - Allow ssh connections
      become: true
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        ctstate: NEW,ESTABLISHED,RELATED
        source: "{{ item }}"
        destination_ports:
          - "22"
        jump: ACCEPT
        state: present
      ignore_errors: true
      loop:
        - "{{ ncom_net_cidr }}"
        - "{{ my_ip }}"
        - "{{ pod_cidr }}"
      
- name: Iptables - Permit existing and related network connections
  become: true
  ansible.builtin.iptables:
    chain: INPUT
    match: conntrack
    ctstate: RELATED,ESTABLISHED
    jump: ACCEPT
    action: insert
    rule_num: 1
    state: present

- name: Iptables - Set the default INPUT DROP policy
  become: true
  ansible.builtin.iptables:
    chain: INPUT
    policy: DROP

- name: Iptables - directory /etc/iptables
  become: true
  file: 
    path: /etc/iptables
    state: directory
    owner: root
  ignore_errors: true

- name: Iptables - Save
  become: true
  community.general.iptables_state:
    ip_version: ipv4
    table: filter
    state: saved
    path: /etc/iptables/rules.v4
